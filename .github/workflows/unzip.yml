name: Apply upgrade
on:
  push:
    paths: [watchly-upgrade.zip]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o watchly-upgrade.zip
          cp -r Watchly-upgrade/. .
          rm -rf Watchly-upgrade watchly-upgrade.zip
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Apply Watchly upgrade"
          git push
